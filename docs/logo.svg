<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background / Glow gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="1"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="1"/>
    </radialGradient>

    <!-- Shield outer border gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Armor Plate Gradient -->
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Core Rocket / Energy Gradient -->
    <linearGradient id="energyGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="25%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Neon Cyan Accent -->
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Filter for subtle drop shadow and cyber glow -->
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur2"/>
      <feComposite in="SourceGraphic" in2="blur2" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Rounded App Icon Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Outer Protective Armor Shield -->
  <g filter="url(#cyberGlow)">
    <!-- Shield Outline -->
    <path d="M 256 64
             C 340 64, 408 88, 416 144
             C 416 270, 348 376, 256 448
             C 164 376, 96 270, 96 144
             C 104 88, 172 64, 256 64 Z"
          fill="url(#plateGrad)"
          stroke="url(#shieldBorder)"
          stroke-width="12"
          stroke-linejoin="round"/>

    <!-- Inner Armor Facet / Plate Lines -->
    <path d="M 256 80 L 256 430" stroke="#334155" stroke-width="3" stroke-dasharray="8 6"/>
    <path d="M 120 156 C 180 180, 240 186, 256 186 C 272 186, 332 180, 392 156" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="4"/>
    <path d="M 136 260 C 186 280, 236 290, 256 290 C 276 290, 326 280, 376 260" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="3"/>
  </g>

  <!-- The "Launch" Vector (Upward Thrusting Supersonic Rocket / Spear) -->
  <g filter="url(#intenseGlow)">
    <!-- Rocket Main Hull / Spearhead -->
    <path d="M 256 128
             C 276 184, 296 248, 296 288
             L 272 288
             L 272 320
             L 256 308
             L 240 320
             L 240 288
             L 216 288
             C 216 248, 236 184, 256 128 Z"
          fill="url(#energyGrad)" />

    <!-- Left Wing / Stabilizer -->
    <path d="M 224 260 L 176 304 L 220 304 Z" fill="url(#cyanAccent)"/>
    <!-- Right Wing / Stabilizer -->
    <path d="M 288 260 L 336 304 L 292 304 Z" fill="url(#cyanAccent)"/>

    <!-- Rocket Canopy / Sensor Port -->
    <polygon points="256,168 264,196 248,196" fill="#0f172a"/>

    <!-- Ion Propulsion Plume / Exhaust -->
    <path d="M 244 324
             L 256 392
             L 268 324
             L 256 336 Z"
          fill="url(#energyGrad)"/>
    <circle cx="256" cy="350" r="14" fill="#38bdf8" opacity="0.8" filter="url(#cyberGlow)"/>
    <circle cx="256" cy="370" r="7" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Corner Security Rivets -->
  <circle cx="256" cy="100" r="4" fill="#38bdf8"/>
  <circle cx="384" cy="160" r="4" fill="#38bdf8"/>
  <circle cx="128" cy="160" r="4" fill="#38bdf8"/>
  <circle cx="348" cy="330" r="4" fill="#38bdf8"/>
  <circle cx="164" cy="330" r="4" fill="#38bdf8"/>
</svg>
