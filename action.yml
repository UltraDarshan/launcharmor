name: 'LaunchArmor Security Audit'
description: 'Finds leaked API keys, open Supabase tables and open Firebase rules in AI-built apps'
author: 'UltraDarshan'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  target_dir:
    description: 'Directory path to scan'
    required: false
    default: '.'
  audit_db:
    description: 'Whether to audit SQL migrations for missing Row Level Security and open policies'
    required: false
    default: 'true'
  sarif:
    description: 'Upload findings to the GitHub Security tab (needs `permissions: security-events: write`)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache: false

    # go run can't target a module outside the caller's repo, so build inside the action dir
    - name: Build LaunchArmor
      shell: bash
      working-directory: ${{ github.action_path }}
      run: go build -o "$RUNNER_TEMP/launcharmor" ./cmd/launcharmor

    - name: Run LaunchArmor Scanner
      id: scan
      shell: bash
      env:
        TARGET_DIR: ${{ inputs.target_dir }}
        SARIF: ${{ inputs.sarif }}
      run: |
        echo "::group::LaunchArmor Code & Secret Audit"
        "$RUNNER_TEMP/launcharmor" scan "$TARGET_DIR" || echo "failed=true" >> "$GITHUB_OUTPUT"
        echo "::endgroup::"
        if [ "$SARIF" = "true" ]; then
          "$RUNNER_TEMP/launcharmor" scan "$TARGET_DIR" --format sarif > "$RUNNER_TEMP/launcharmor-scan.sarif" || true
        fi

    - name: Run LaunchArmor Database Audit
      id: db
      if: inputs.audit_db == 'true'
      shell: bash
      env:
        TARGET_DIR: ${{ inputs.target_dir }}
        SARIF: ${{ inputs.sarif }}
      run: |
        echo "::group::LaunchArmor Database RLS Audit"
        "$RUNNER_TEMP/launcharmor" db-audit "$TARGET_DIR" || echo "failed=true" >> "$GITHUB_OUTPUT"
        echo "::endgroup::"
        if [ "$SARIF" = "true" ]; then
          "$RUNNER_TEMP/launcharmor" db-audit "$TARGET_DIR" --format sarif > "$RUNNER_TEMP/launcharmor-db.sarif" || true
        fi

    # One upload per category: GitHub rejects several runs of the same tool+category in one upload
    - name: Upload code findings to GitHub Security
      if: inputs.sarif == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ runner.temp }}/launcharmor-scan.sarif
        category: launcharmor-scan

    - name: Upload database findings to GitHub Security
      if: inputs.sarif == 'true' && inputs.audit_db == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ runner.temp }}/launcharmor-db.sarif
        category: launcharmor-db

    - name: Fail on critical or high findings
      if: steps.scan.outputs.failed == 'true' || steps.db.outputs.failed == 'true'
      shell: bash
      run: |
        echo "::error::LaunchArmor found critical or high severity issues. See the logs above for each fix."
        exit 1
