name: 'VibeShield Security Audit'
description: 'Zero-cost security auditor & database RLS checker for vibe-coded applications'
author: 'UltraDarshan'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  target_dir:
    description: 'Directory path to scan'
    required: false
    default: '.'
  audit_db:
    description: 'Whether to audit SQL schema files for missing Row Level Security (RLS)'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache: false

    # go run can't target a module outside the caller's repo, so build inside the action dir
    - name: Build VibeShield
      shell: bash
      working-directory: ${{ github.action_path }}
      run: go build -o "$RUNNER_TEMP/vibeshield" ./cmd/vibeshield

    - name: Run VibeShield Scanner
      shell: bash
      env:
        TARGET_DIR: ${{ inputs.target_dir }}
      run: |
        echo "::group::VibeShield Code & Secret Audit"
        "$RUNNER_TEMP/vibeshield" scan "$TARGET_DIR"
        echo "::endgroup::"

    - name: Run VibeShield Database Audit
      if: inputs.audit_db == 'true'
      shell: bash
      env:
        TARGET_DIR: ${{ inputs.target_dir }}
      run: |
        echo "::group::VibeShield Database RLS Audit"
        "$RUNNER_TEMP/vibeshield" db-audit "$TARGET_DIR"
        echo "::endgroup::"
