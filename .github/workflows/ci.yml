name: CI & Self-Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build, Test & Self-Audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Check formatting and vet
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...

      - name: Build binary
        run: make build

      - name: Run automated unit tests
        run: make test

      - name: Run self-audit with VibeShield
        run: |
          ./bin/vibeshield scan .
          ./bin/vibeshield db-audit .

  action:
    name: Composite action works from a consumer repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: vibeshield
      - name: Create a clean sample project
        run: mkdir sample && echo 'console.log("hello")' > sample/index.js
      - uses: ./vibeshield
        with:
          target_dir: sample

      # The action must also BLOCK a leaky project, not just pass a clean one
      - name: Create a leaky sample project
        run: |
          mkdir leaky
          echo "const stripe = Stripe(\"sk_li""ve_51HxYz2AbCdEfGh3IjKlMn4OpQr\");" > leaky/pay.js
      - uses: ./vibeshield
        id: leaky
        continue-on-error: true
        with:
          target_dir: leaky
      - name: Assert the leaky project was rejected
        if: steps.leaky.outcome != 'failure'
        run: |
          echo "::error::VibeShield did not fail on a hardcoded Stripe key"
          exit 1
