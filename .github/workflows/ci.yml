name: CI & Self-Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build, Test & Self-Audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Check formatting and vet
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...

      - name: Build binary
        run: make build

      - name: Run automated unit tests
        run: make test

      - name: Run self-audit with VibeShield
        run: |
          ./bin/vibeshield scan .
          ./bin/vibeshield db-audit .

  action:
    name: Composite action works from a consumer repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: vibeshield
      - name: Create a clean sample project
        run: mkdir sample && echo 'console.log("hello")' > sample/index.js
      - uses: ./vibeshield
        with:
          target_dir: sample
